; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
;  Select board to build / upload:
;     esp32dev  -> ESP32 sensors + LCD + sends motor commands   (src/*.cpp)
;     nano      -> Arduino Nano motor controller                 (src/nano/)
; ============================================================
[platformio]
default_envs = esp32dev 


[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<nano/>
; upload_port = COM9
; monitor_port = COM9
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.4
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    links2004/WebSockets@^2.4.1


[env:nano]
platform = atmelavr
board = nanoatmega328new   ; new bootloader. If upload fails ("not in sync") use: nanoatmega328
framework = arduino
monitor_speed = 9600      ; same as ESP32 link baud
build_src_filter = +<nano/>
